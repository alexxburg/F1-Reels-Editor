[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-reels"
version = "0.1.0"
description = "Typed F1 reels editing pipeline (B-roll, end card, CLI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "moviepy==1.0.3",
    "imageio==2.31.1",
    "imageio-ffmpeg==0.6.0",
    "numpy==1.26.4",
    "pillow==9.5.0",
    "requests",
    "python-dotenv",
    "faster-whisper",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
f1-reels = "f1_reels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1_reels = ["templates/*.html", "static/*", "footer_prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
